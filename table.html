<!DOCTYPE html>
<html>
<head>
    <title>HTML Table</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 24px;
        }

        th, td {
            border: 2px solid black;
            padding: 12px;
            text-align: left;
        }

        th {
            font-weight: bold;
        }

        .yellow {
            background-color: yellow;
        }

        .blue {
            background-color: #00aeef;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Col Head1</th>
        <th>Col Head2</th>
        <th>Col Head3</th>
        <th>Col Head4</th>
        <th>Col Head5</th>
    </tr>

    <tr>
        <td>Row1 Cell1</td>
        <td class="yellow">Row1 Cell2</td>
        <td>Row1 Cell3</td>
        <td>Row1 Cell4</td>
        <td>Row1 Cell5</td>
    </tr>

    <tr>
        <td>Row2 Cell1</td>
        <td colspan="2">Row2 Cell2</td>
        <td>Row2 Cell3</td>
        <td rowspan="2"><i>Row2 Cell4</i></td>
    </tr>

    <tr>
        <td>Row3 Cell1</td>
        <td rowspan="2">Row1 Cell2</td>
        <td>Row3 Cell3</td>
        <td><b>Row3 Cell4</b></td>
    </tr>
